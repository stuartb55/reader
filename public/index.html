<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Reader</title>
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reader">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<header>
  <h1>Reader <span id="count" class="count"></span></h1>
  <div class="seg" role="group" aria-label="Show">
    <button id="show-unread" class="on" type="button" aria-pressed="true">Unread</button>
    <button id="show-all" type="button" aria-pressed="false">Read too</button>
  </div>
  <div class="actions">
    <button id="options-open" class="icon" type="button" title="View options" aria-label="View options">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
    <button id="refresh" class="icon" type="button" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>
    </button>
    <button id="mark-all" class="icon" type="button" title="Mark all as read" aria-label="Mark all as read">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13l4 4 8-9M11 16l1.5 1.5L21 8"/></svg>
      <span class="label">Mark all read</span>
    </button>
  </div>
  <nav id="scopes" class="chips" aria-label="Categories">
    <button class="chip on" type="button" data-stream="reading-list">All feeds</button>
  </nav>
  <nav id="feeds" class="chips sub" aria-label="Feeds" hidden></nav>
</header>
<main>
  <div id="ptr" class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></div>
  <p id="banner" class="banner" role="status" hidden></p>
  <div id="grid" class="grid"></div>
  <p id="status" class="status" role="status"></p>
  <div id="sentinel"></div>
</main>

<dialog id="article" aria-labelledby="a-title">
  <div class="bar">
    <button id="a-close" class="icon" type="button" aria-label="Back to the list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <span class="spacer"></span>
    <button id="a-options" class="icon" type="button" aria-label="Reading options">Aa</button>
    <button id="a-share" class="icon" type="button" aria-label="Share">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    </button>
    <button id="a-star" class="icon" type="button" aria-label="Star" aria-pressed="false">☆</button>
    <button id="a-unread" type="button">Keep unread</button>
  </div>
  <article id="a-scroll">
    <h2 id="a-title"></h2>
    <p id="a-meta" class="meta"></p>
    <p id="a-note" class="meta" role="status"></p>
    <div id="a-body" class="body"></div>
    <p class="source"><a id="a-link" target="_blank" rel="noopener noreferrer">View on the original site ↗</a></p>
  </article>
  <div class="nav">
    <button id="a-prev" type="button">‹ Previous</button>
    <button id="a-next" type="button">Next ›</button>
  </div>
</dialog>

<dialog id="confirm" aria-labelledby="c-text">
  <p id="c-text"></p>
  <fieldset class="choices">
    <legend class="sr">Which items</legend>
    <label><input type="radio" name="age" value="all" checked> <span id="c-all">All of them</span></label>
    <label><input type="radio" name="age" value="1"> Only those that arrived over a day ago</label>
    <label><input type="radio" name="age" value="7"> Only those that arrived over a week ago</label>
  </fieldset>
  <div class="row">
    <button id="c-cancel" type="button">Cancel</button>
    <button id="c-ok" class="primary" type="button">Mark all read</button>
  </div>
</dialog>

<dialog id="options" aria-labelledby="o-title">
  <div class="bar">
    <h2 id="o-title">Options</h2>
    <span class="spacer"></span>
    <button id="o-close" type="button">Done</button>
  </div>
  <div class="opts">
    <div class="opt"><span id="o-layout">Layout</span>
      <div class="seg" role="group" aria-labelledby="o-layout" data-pref="compact">
        <button type="button" data-v="false">Cards</button><button type="button" data-v="true">List</button>
      </div>
    </div>
    <div class="opt"><span id="o-order">Order</span>
      <div class="seg" role="group" aria-labelledby="o-order" data-pref="order">
        <button type="button" data-v='"newest"'>Newest first</button><button type="button" data-v='"oldest"'>Oldest first</button>
      </div>
    </div>
    <div class="opt"><span id="o-scroll">Mark read as you scroll</span>
      <div class="seg" role="group" aria-labelledby="o-scroll" data-pref="markOnScroll">
        <button type="button" data-v="false">Off</button><button type="button" data-v="true">On</button>
      </div>
    </div>
    <div class="opt"><span id="o-theme">Theme</span>
      <div class="seg" role="group" aria-labelledby="o-theme" data-pref="theme">
        <button type="button" data-v='"auto"'>Auto</button><button type="button" data-v='"light"'>Light</button><button type="button" data-v='"dark"'>Dark</button>
      </div>
    </div>
    <div class="opt"><span id="o-font">Article font</span>
      <div class="seg" role="group" aria-labelledby="o-font" data-pref="font">
        <button type="button" data-v='"sans"'>Sans</button><button type="button" data-v='"serif"'>Serif</button>
      </div>
    </div>
    <div class="opt"><span id="o-size">Article text size</span>
      <div class="seg" role="group" aria-labelledby="o-size" data-pref="size">
        <button type="button" data-v="0">Small</button><button type="button" data-v="1">Medium</button><button type="button" data-v="2">Large</button>
      </div>
    </div>
    <div class="opt"><span id="o-offline">Save articles for offline</span>
      <div class="seg" role="group" aria-labelledby="o-offline" data-pref="offlineArticles">
        <button type="button" data-v="true">On</button><button type="button" data-v="false">Off</button>
      </div>
    </div>
    <p class="keys meta">Keyboard: <kbd>j</kbd> <kbd>k</kbd> move, <kbd>Enter</kbd> open, <kbd>m</kbd> mark read, <kbd>s</kbd> star, <kbd>r</kbd> refresh, <kbd>?</kbd> options.</p>
  </div>
</dialog>

<div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-action" type="button"></button></div>
<script type="module" src="/app.js"></script>
</body>
</html>
